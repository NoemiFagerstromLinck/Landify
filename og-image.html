<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d1b4e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            text-align: center;
            padding: 60px;
        }
        .logo {
            font-size: 120px;
            font-weight: bold;
            background: linear-gradient(135deg, #6B4EFF 0%, #E46BFF 50%, #C3B8FF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
        }
        .tagline {
            font-size: 48px;
            color: white;
            font-weight: 300;
            margin-bottom: 20px;
        }
        .description {
            font-size: 32px;
            color: #C3B8FF;
            font-weight: 300;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">LANDIFY</div>
        <div class="tagline">Desarrollo Web para PyMEs en Chile</div>
        <div class="description">Tiendas Online • WordPress • Desarrollo Custom</div>
    </div>
</body>
</html>
